# Copier configuration for the cookiecutter-pyproject template.
#
# Run with:  uvx --with jinja2-time copier copy gh:markusritschel/cookiecutter-pyproject my-project
#
# Settings ---------------------------------------------------------------------
_subdirectory: template
_templates_suffix: ".jinja"
_jinja_extensions:
  - jinja2_time.TimeExtension

# Files left untouched by `copier update` once they exist in the generated
# project (e.g. user-authored docs, tests and README).
_skip_if_exists:
  - "docs/**/*.md"
  - "**/*.bib"
  - "tests/**"
  - "README.md"

_message_before_copy: |
  ☝🏼 Important: You will now be asked to fill in some information about your project.

  When asked for the project name [4], you may use a normal name with spaces, e.g. "My new Project".
  The project slug [5] (which is used for the directory name and the package name) will be generated
  automatically from the project name by replacing spaces with dashes and converting to lowercase,
  e.g. "my-new-project". For the python package name [6], remaining dashes will be replaced with
  underscores ("my_new_project") to ensure proper naming.
  Of course, you can also directly specify the project slug and package name if you want to use a
  different naming convention.

  👉🏼 Research Projects: If you answer "yes" to the question "Is this a research project?" [7], some
  additional directories will be created for you (e.g. data, notebooks, references, results, src).
  If you answer "no", these directories will not be created.

  Let's go 😃

_message_after_copy: |
  🎉 Project setup complete! How to get started:
  ----------------------------------------------

  1. Change directory into your project (if you aren't already):
       cd {{ _copier_conf.dst_path }}/

  2. Activate your virtual environment (see the README.md for more details):
       On Linux/macOS: source .venv/bin/activate
       On Windows:     .\.venv\Scripts\activate

  3. Add a remote git repository (optional):
       git remote add origin https://github.com/{{ github_username }}/{{ project_slug }}

  4. To add packages, use:
       uv add <package_name>

  5. To run scripts, use:
       uv run python <script.py>

  6. To build documentation:
       just docs

  Happy coding! 🚀

# Tasks ------------------------------------------------------------------------
# Ported from the old hooks/post_gen_project.py. Tasks require `--trust` and run
# on `copier copy` only (guarded via `_copier_operation`), never on `copier update`.
_tasks:
  - command: |
      if command -v git >/dev/null 2>&1; then
        git init -q
        git branch -m main
        git add -A
        git rm --cached -q --ignore-unmatch notebooks/*.ipynb scripts/*.py "src/{{ package_name }}/cli.py" "src/{{ package_name }}/submodule.py" tests/*.py
        git commit -q -m "Set up new project from copier template https://github.com/markusritschel/cookiecutter-pyproject"
      else
        echo "WARNING: 'git' not found. Initialize the repository manually:"
        echo "  git init && git branch -m main && git add . && git commit -m 'Initial commit'"
      fi
    when: "{{ _copier_operation == 'copy' }}"
  - command: |
      if command -v uv >/dev/null 2>&1; then
        uv sync --dev
        uv run pre-commit install
        if command -v git >/dev/null 2>&1; then
          git add uv.lock pyproject.toml
          git commit -q -m "Set up pre-commit hooks and install dev dependencies"
        fi
      else
        echo "WARNING: 'uv' not found. Run the following manually after installation:"
        echo "  uv sync --dev"
        echo "  uv run pre-commit install"
      fi
    when: "{{ _copier_operation == 'copy' }}"

# Questions --------------------------------------------------------------------
project_author:
  type: str
  help: Your full name
  default: John Doe

email:
  type: str
  help: Your email address
  default: johndoe@github.com

github_username:
  type: str
  help: Your GitHub username
  default: johndoe

project_name:
  type: str
  help: The human-readable name of your project (spaces allowed)
  default: Python Boilerplate

project_slug:
  type: str
  help: The directory and repository name (derived from the project name)
  default: "{{ project_name|lower|replace(' ', '-') }}"

package_name:
  type: str
  help: The importable Python package name (derived from the project slug)
  default: "{{ project_slug|lower|replace('-', '_') }}"
  validator: >-
    {% if not (package_name | regex_search('^[_a-zA-Z][_a-zA-Z0-9]+$')) %}
    {{ package_name }} is not a valid Python package name!
    {% endif %}

is_research_project:
  type: bool
  help: Is this a research project? (adds data/, notebooks/, references/, reports/, scripts/)
  default: true

project_description:
  type: str
  help: A short description of your project
  default: A boilerplate for scientific projects using Python

project_version:
  type: str
  help: The initial version of your project
  default: 0.1.0

command_line_interface:
  type: str
  help: Which command-line interface library would you like to use?
  choices:
    - Typer
    - Click
    - Docopt
    - No command-line interface
  default: Typer

project_license:
  type: str
  help: Choose a license for your project
  choices:
    - MIT license
    - BSD license
    - ISC license
    - Apache Software License 2.0
    - GNU General Public License v3
    - Not open source
  default: MIT license

docs_engine:
  type: str
  help: Which documentation engine would you like to use?
  choices:
    - Sphinx
    - Zensical
    - MyST
  default: Sphinx
